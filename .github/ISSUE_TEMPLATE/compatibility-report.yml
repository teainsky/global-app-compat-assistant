name: 兼容性反馈
description: 反馈设备检测、Google 环境诊断或已验证配置问题
title: "[兼容性] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿填写账号、IMEI、Android ID、序列号、手机号、MAC、联系人或 SIM 标识。
  - type: input
    id: model
    attributes:
      label: 设备型号
      placeholder: 例如 HBN-AL80
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与版本
      placeholder: 例如 HarmonyOS 4.2.0 / Android API 31
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 问题发生阶段
      options:
        - 开始检测
        - 检测结果
        - Google 环境诊断
        - 自检
        - 已验证设备配置
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果
      description: 请描述界面提示；技术详情可脱敏后粘贴。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认反馈中不包含账号内容或设备唯一身份信息。
          required: true
